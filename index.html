<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SL Control — มือถือ</title>
<style>
  :root{
    --red:#d93a41; --red-d:#c02830; --ink:#1f2933; --muted:#6b7683;
    --line:#e6e9ee; --bg:#f4f6f9; --green:#127a2e; --amber:#c98a12; --grey:#8a94a0;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    font-family:"Prompt","Sarabun","Segoe UI",Tahoma,sans-serif;}
  html,body{height:100%;}
  body{background:#dfe4ea; color:var(--ink);}
  .wrap{max-width:460px; margin:0 auto; height:100%; background:var(--bg); position:relative;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 30px rgba(20,30,45,.12);}
  .hide{display:none !important;}

  /* ---------- login ---------- */
  #login{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px 26px; background:#fff;}
  .logo{width:64px; height:64px; border-radius:16px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; letter-spacing:1px; margin-bottom:16px;}
  #login h1{font-size:22px; margin-bottom:4px;}
  #login p{color:var(--muted); font-size:13px; margin-bottom:26px; text-align:center;}
  .field{width:100%; margin-bottom:12px;}
  .field label{font-size:12px; color:var(--muted); display:block; margin-bottom:5px;}
  input,textarea{width:100%; border:1px solid #cfd6de; border-radius:10px; padding:12px 13px; font-size:15px; color:var(--ink); background:#fff;}
  input:focus,textarea:focus{outline:none; border-color:var(--red);}
  .btn{border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; width:100%;}
  .btn.primary{background:var(--red); color:#fff;}
  .btn.primary:active{background:var(--red-d);}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid #cbd3dc;}
  .or{color:#aab2bd; font-size:12px; margin:14px 0;}
  .scanbtn{display:flex; align-items:center; gap:8px; justify-content:center;}

  /* ---------- app shell ---------- */
  #app{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  .top{background:#fff; border-bottom:1px solid var(--line); padding:14px 15px 11px; display:flex; justify-content:space-between; align-items:center; flex:none;}
  .top .t{font-size:17px; font-weight:700;}
  .top .r{font-size:12px; color:var(--green); font-weight:600;}
  .screen{flex:1; overflow-y:auto; padding:11px 13px 90px;}
  .screen.hide{display:none;}

  /* chips */
  .chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:9px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{font-size:12px; padding:6px 13px; border-radius:20px; border:1px solid #d5dbe2; color:#4a5563; white-space:nowrap; background:#fff; cursor:pointer;}
  .chip.on{background:var(--red); color:#fff; border-color:var(--red);}

  /* machine card */
  .mc{border:1px solid #dfe4ea; border-radius:12px; padding:11px 12px; display:flex; align-items:center; gap:10px; background:#fff; margin-bottom:9px; cursor:pointer;}
  .mc.sel{border:2px solid var(--red); background:#fdf3f4; padding:10px 11px;}
  .mc.off{opacity:.65;}
  .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .dot.on{background:var(--green);} .dot.off{background:var(--grey);}
  .mc .nm{font-weight:700; font-size:15px;}
  .mc .sub{font-size:11px; color:var(--muted);}
  .grow{flex:1;}
  .batt{display:flex; align-items:center; gap:5px;}
  .track{width:48px; height:9px; background:#e6e9ee; border-radius:5px; overflow:hidden;}
  .fill{height:100%; border-radius:5px;}
  .pct{font-size:12px; color:#3a4655; font-weight:600; min-width:34px; text-align:right;}
  .bolt{width:12px; height:12px;}
  .chk{width:22px; height:22px; border-radius:50%; border:2px solid #cbd3dc; flex:none; position:relative;}
  .chk.y{background:var(--red); border-color:var(--red);}
  .chk.y:after{content:""; position:absolute; left:6px; top:2.5px; width:6px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);}

  /* selection floating bar */
  .selbar{position:absolute; left:13px; right:13px; bottom:74px; background:var(--red); color:#fff; border-radius:12px; padding:13px 16px; display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:15px; box-shadow:0 6px 18px rgba(217,58,65,.35); cursor:pointer;}

  /* tab bar */
  .tabs{position:absolute; left:0; right:0; bottom:0; display:flex; border-top:1px solid var(--line); background:#fff;}
  .tab{flex:1; text-align:center; padding:9px 2px 11px; font-size:11px; color:#8a94a0; cursor:pointer;}
  .tab .ic{width:22px; height:22px; display:block; margin:0 auto 3px;}
  .tab.on{color:var(--red); background:#fdecee; box-shadow:inset 0 2px 0 var(--red);}

  /* action sheet / modal */
  .ov{position:absolute; inset:0; background:rgba(20,28,38,.42); display:flex; align-items:flex-end; z-index:40;}
  .ov.center{align-items:center; justify-content:center;}
  .sheet{background:#fff; width:100%; border-radius:18px 18px 0 0; padding:16px 15px calc(16px + env(safe-area-inset-bottom));}
  .sheet.card{width:calc(100% - 36px); max-width:400px; border-radius:16px; margin:0 auto;}
  .sh-h{font-weight:700; font-size:16px;}
  .sh-s{font-size:12px; color:var(--muted); margin:2px 0 12px;}
  .agrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .act{border:1px solid #dfe4ea; border-radius:13px; padding:14px 6px; text-align:center; cursor:pointer; background:#fff;}
  .act:active{background:#f4f6f9;}
  .act .ic{width:25px; height:25px; margin:0 auto 6px; display:block;}
  .act .tx{font-size:12px; font-weight:600;}
  .act.danger{border-color:#f0c4c7;} .act.danger .tx{color:var(--red-d);}
  .seg{display:flex; background:#eef1f5; border-radius:9px; padding:3px; margin-bottom:10px;}
  .seg div{flex:1; text-align:center; padding:8px; border-radius:7px; font-size:13px; font-weight:600; color:#5a6572; cursor:pointer;}
  .seg div.on{background:#fff; color:var(--red); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .rowbtn{display:flex; gap:10px; margin-top:12px;}
  .mono{font-family:Consolas,"Courier New",monospace;}

  /* results / file rows */
  .rr{display:flex; align-items:center; gap:8px; padding:11px 4px; border-bottom:1px solid #eef1f4; cursor:pointer;}
  .rr .nm{font-weight:600; font-size:14px; min-width:66px;}
  .rr .ans{font-size:12px; color:#55606d; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .g{color:var(--green);} .r{color:var(--red-d);} .gy{color:var(--grey);}
  .foot{font-size:13px; padding:11px 3px; color:#3a4655;}
  .empty{text-align:center; color:#9aa3af; padding:56px 20px; font-size:14px;}
  .empty .ic{width:44px; height:44px; margin:0 auto 12px; display:block; opacity:.5;}
  .fs{padding:11px 3px; border-bottom:1px solid #eef1f4;}
  .fs .top2{display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px;}
  .fs .top2 .nm{font-weight:600;}
  .pbar{height:8px; background:#e6e9ee; border-radius:5px; overflow:hidden;}
  .pfill{height:100%; background:var(--red); border-radius:5px; transition:width .3s;}
  .pfill.done{background:var(--green);}
  .small{font-size:11px; color:var(--muted);}
  .fbrow{background:#fff; border:1px solid #dfe4ea; border-radius:10px; padding:11px 12px; font-size:13px; color:#3a4655; margin-bottom:10px;}
  .flist .fi{display:flex; align-items:center; gap:10px; padding:11px 6px; border-bottom:1px solid #eef1f4; cursor:pointer;}
  .flist .fi .ic{width:22px;height:22px;flex:none;}
  .lockrow{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #dfe4ea; border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer;}
  .lockrow .ic{width:26px;height:26px;flex:none;}
  .lockrow .tx b{font-size:15px;} .lockrow .tx div{font-size:12px;color:var(--muted);}

  /* toast */
  #toast{position:absolute; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px); background:#26303c; color:#fff; padding:11px 18px; border-radius:22px; font-size:13px; opacity:0; transition:.25s; z-index:60; white-space:nowrap; max-width:90%;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<script src="ably.min.js"></script>
<script>
  // ตั้งค่าเชื่อมต่อ (แก้ตอน deploy): {authUrl:'https://.../exec'} · เว้นว่าง = เดโมข้อมูลจำลอง
  window.SL_CONFIG = window.SL_CONFIG || {};
</script>
</head>
<body>
<div class="wrap">

  <!-- ============ LOGIN ============ -->
  <div id="login">
    <div class="logo">SL</div>
    <h1>SL Control</h1>
    <p>ใส่คีย์ของเครื่องคอนโซล เพื่อคุมผ่านมือถือ</p>
    <div class="field" style="max-width:340px">
      <label>คีย์ (License Key)</label>
      <input id="keyInput" placeholder="เช่น SL-XXXX-XXXX-XXXX" autocomplete="off">
    </div>
    <div style="width:100%;max-width:340px">
      <button class="btn primary" onclick="doConnect()">เชื่อมต่อ</button>
      <div class="or" style="text-align:center">— หรือ —</div>
      <button class="btn ghost scanbtn" onclick="toast('ของจริง: สแกน QR ที่โปรแกรมบน PC แล้วเข้าหน้านี้พร้อมคีย์อัตโนมัติ')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f2933" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 14v.01M14 20v.01M20 20v.01M17 17h.01"/></svg>
        สแกน QR จากโปรแกรม
      </button>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hide">
    <div class="top"><div class="t" id="topT">SL Control</div><div class="r" id="topR"></div></div>

    <!-- machines -->
    <div class="screen" id="s-machines">
      <div class="chips" id="chips"></div>
      <div id="mlist"></div>
    </div>
    <!-- command results -->
    <div class="screen hide" id="s-command"></div>
    <!-- files -->
    <div class="screen hide" id="s-files"></div>
    <!-- lock -->
    <div class="screen hide" id="s-lock"></div>

    <div class="selbar hide" id="selbar" onclick="openActions()"><span id="selCount">เลือก 0</span><span>สั่งงาน ▸</span></div>

    <div class="tabs">
      <div class="tab on" data-v="machines" onclick="switchTab('machines')">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>เครื่อง</div>
      <div class="tab" data-v="command" onclick="switchTab('command')">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 8 10 12 6 16"/><line x1="13" y1="16" x2="18" y2="16"/></svg>คำสั่ง</div>
      <div class="tab" data-v="files" onclick="switchTab('files')">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h6l2 2h8v10H4z"/></svg>ไฟล์</div>
      <div class="tab" data-v="lock" onclick="switchTab('lock')">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>ล็อก</div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
// ================= MOCK TRANSPORT (สลับเป็น Ably ทีหลัง) =================
const delay = ms => new Promise(r=>setTimeout(r,ms));
function mkMachines(){
  const arr=[]; const n=12;
  for(let i=1;i<=n;i++){
    const online = i!==4 && i!==9;
    const plugged = online && (i%3===0);
    const pct = online ? (i===5?18:(i===11?9:30+((i*17)%68))) : 0;
    arr.push({id:'m'+i, name:'HP-Z'+String(i).padStart(2,'0'), ip:'192.168.1.'+(10+i),
      online, batt:{percent:pct, plugged}});
  }
  return arr;
}
function FS(path){   // ไฟล์บน PC (จำลอง — เฟสนี้ยังไม่ดึงจาก PC จริง)
  if(!path||path==='root') return {path:'คอมพิวเตอร์นี้ (PC)', up:null, items:[
    {name:'Desktop', dir:true, path:'desktop'},{name:'Downloads', dir:true, path:'downloads'},
    {name:'D:\\Setup', dir:true, path:'setup'}]};
  if(path==='setup') return {path:'D:\\Setup', up:'root', items:[
    {name:'program.exe', dir:false, size:'45 MB', path:'D:\\Setup\\program.exe'},{name:'driver.zip', dir:false, size:'12 MB', path:'D:\\Setup\\driver.zip'},
    {name:'config.ini', dir:false, size:'3 KB', path:'D:\\Setup\\config.ini'}]};
  return {path, up:'root', items:[{name:'ตัวอย่าง.pdf', dir:false, size:'2 MB', path:'X\\ตัวอย่าง.pdf'},{name:'รูป.png', dir:false, size:'800 KB', path:'X\\รูป.png'}]};
}
const MockT = {
  connect:(key)=>delay(450).then(mkMachines),
  lock:(ids,msg)=>delay(300), unlock:(ids)=>delay(300),
  power:(ids,act)=>delay(300), popup:(ids,msg)=>delay(300),
  runCommand:(ids,shell,cmd)=>delay(1400).then(()=> ids.map((id,ix)=>{
      const m=byId(id); const ok = ix%5!==2;
      return {id, name:m.name, code:ok?0:1,
        output: ok ? (cmd.trim().toLowerCase().startsWith('whoami')? m.name.toLowerCase()+'\\student'
                    : cmd.trim().toLowerCase().startsWith('ipconfig')? 'Windows IP Configuration\n\n   IPv4 Address. . : '+m.ip+'\n   Subnet Mask . . : 255.255.255.0'
                    : 'OK (จำลอง)') : 'ปฏิเสธการเข้าถึง (Access denied)'};
    })),
  listFiles:(path)=>delay(300).then(()=>FS(path)),
  sendFile:(ids,path,name)=>{
    const items=ids.map(id=>({id,name:byId(id).name,pct:0,done:false,fail:false}));
    const job={jobId:'mock'+Date.now(), file:(name||path), items};
    const t=setInterval(()=>{ let all=true;
      job.items.forEach((it,ix)=>{ if(it.done||it.fail)return; all=false;
        it.pct=Math.min(100,it.pct+6+(ix%3)*4+Math.random()*8);
        if(it.pct>=100){it.pct=100; if(ix%6===4)it.fail=true; else it.done=true;} });
      applyFileProgress({jobId:job.jobId,file:job.file,items:job.items.map(x=>({...x}))});
      if(all)clearInterval(t);
    },700);
  },
};
// ================= ABLY TRANSPORT (ของจริง) =================
const CFG = window.SL_CONFIG || {};
const USE_ABLY = !!(CFG.ablyKey || CFG.authUrl || new URLSearchParams(location.search).get('token'));
const AblyT = (function(){
  let ably, ch, pending={}, pcResolve=null;
  async function channelName(k){
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(k));
    return 'sl-ctrl-'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20);
  }
  const pub=(name,data)=>{ if(ch) ch.publish(name,data); };
  return {
    async connect(k){
      const chan=await channelName(k);
      const opts = window.SL_TOKEN ? {token:window.SL_TOKEN}
                 : CFG.ablyKey ? {key:CFG.ablyKey}
                 : {authUrl:CFG.authUrl, authParams:{key:k}};
      opts.echoMessages=false;
      if(!window.SL_TOKEN) opts.clientId='phone-'+Math.random().toString(36).slice(2);
      ably=new Ably.Realtime(opts);
      ch=ably.channels.get(chan);
      ch.subscribe('state', m=>applyState(m.data));
      ch.subscribe('cmdResult', m=>{ const p=pending[m.data.reqId]; if(p){p(m.data.results); delete pending[m.data.reqId];} });
      ch.subscribe('fileProgress', m=>applyFileProgress(m.data));
      ch.subscribe('pcFiles', m=>{ if(pcResolve){ pcResolve(m.data); pcResolve=null; } });
      ably.connection.on('connected', ()=>pub('hello',{}));
      return await new Promise(res=>{ state._firstStateResolve=res; setTimeout(()=>res(state.machines||[]), 6000); });
    },
    lock:(ids,msg)=>pub('cmd',{action:'lock',ids,message:msg||''}),
    unlock:(ids)=>pub('cmd',{action:'unlock',ids}),
    power:(ids,act)=>pub('cmd',{action:act,ids}),
    popup:(ids,msg)=>pub('cmd',{action:'popup',ids,message:msg||''}),
    runCommand:(ids,shell,cmd)=>new Promise(res=>{
      const req='r'+Date.now()+Math.random().toString(36).slice(2,5); pending[req]=res;
      pub('cmd',{action:'runcmd',ids,shell,command:cmd,reqId:req});
      setTimeout(()=>{ if(pending[req]){ delete pending[req];
        res(ids.map(id=>({id,name:(byId(id)||{name:id}).name,code:-1,output:'ไม่ตอบกลับ (timeout)'}))); } }, 30000);
    }),
    listFiles:(path)=>new Promise(res=>{
      pcResolve=res;
      pub('cmd',{action:'listpc', path:(path==='root'?'':(path||''))});
      setTimeout(()=>{ if(pcResolve){ pcResolve({path:path||'',up:'root',items:[],error:'ไม่ตอบ (คอนโซลออนไลน์ไหม?)'}); pcResolve=null; } }, 8000);
    }),
    sendFile:(ids,path,name)=>pub('cmd',{action:'sendfile',ids,path,file:name,jobId:'j'+Date.now()+Math.random().toString(36).slice(2,5)}),
  };
})();
let T = MockT;

// ================= STATE =================
const state = { key:null, machines:[], sel:new Set(), view:'machines', filter:'all',
  lastResults:null, fileJob:null };
const $ = s=>document.querySelector(s);
const byId = id => state.machines.find(m=>m.id===id);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2600); }
function bolt(c){ return `<svg class="bolt" viewBox="0 0 24 24" fill="${c}"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>`; }

// ================= LOGIN =================
function doConnect(){
  const k = $('#keyInput').value.trim();
  if(!k){ toast('ใส่คีย์ก่อน'); return; }
  connectWith(k);
}
function connectWith(k){
  state.key=k;
  T = USE_ABLY ? AblyT : MockT;
  toast('กำลังเชื่อมต่อ...');
  T.connect(k).then(ms=>{
    state.machines = ms || state.machines || [];
    $('#login').classList.add('hide'); $('#app').classList.remove('hide');
    renderChips(); renderMachines(); updateTop(); switchTab('machines');
    if(USE_ABLY && !state.machines.length)
      toast('ต่อ Ably แล้ว แต่ยังไม่เห็นคอนโซล — เปิดโปรแกรม SL Control บน PC หรือยัง?');
  }).catch(e=>{ toast('เชื่อมต่อไม่ได้: '+((e&&e.message)||e)); });
}
// รับสถานะ/คืบหน้าไฟล์ที่คอนโซล push มา (Ably)
function applyState(data){
  state.machines = (data.machines||[]).map(m=>({
    id:m.id, name:m.name, ip:m.ip, online:m.online, locked:m.locked,
    batt: m.batt || m.battery || {percent:0, plugged:false}
  }));
  if(state._firstStateResolve){ state._firstStateResolve(state.machines); state._firstStateResolve=null; }
  updateTop();
  if(state.view==='machines') renderMachines();
}
function applyFileProgress(data){
  if(!state.fileJob) state.fileJob={jobId:data.jobId,name:data.file,size:'',items:[]};
  state.fileJob.jobId=data.jobId; state.fileJob.name=data.file;
  state.fileJob.items=(data.items||[]).map(it=>({id:it.id,name:it.name,pct:it.pct,done:!!it.done,fail:!!it.fail}));
  if(state.view==='files') renderFiles();
  if((data.items||[]).length && data.items.every(it=>it.done||it.fail) && !state.fileJob._done){
    state.fileJob._done=true; toast('ส่งไฟล์เสร็จแล้ว');
  }
}
// auto-login ถ้ามี ?key= (จำลองการสแกน QR)
(function(){ const p=new URLSearchParams(location.search); const k=p.get('key'); const t=p.get('token'); if(t) window.SL_TOKEN=t; if(k) connectWith(k); })();

// ================= MACHINES =================
const FILTERS=[['all','ทั้งหมด'],['online','ออนไลน์'],['offline','ออฟไลน์'],['charging','กำลังชาร์จ'],['low','แบตต่ำ']];
function renderChips(){
  $('#chips').innerHTML = FILTERS.map(([k,l])=>`<div class="chip ${state.filter===k?'on':''}" onclick="setFilter('${k}')">${l}</div>`).join('');
}
function setFilter(k){ state.filter=k; renderChips(); renderMachines(); }
function matchFilter(m){
  if(state.filter==='online') return m.online;
  if(state.filter==='offline') return !m.online;
  if(state.filter==='charging') return m.online && m.batt.plugged;
  if(state.filter==='low') return m.online && m.batt.percent<=20;
  return true;
}
function renderMachines(){
  const list = state.machines.filter(matchFilter);
  $('#mlist').innerHTML = list.map(m=>{
    const sel = state.sel.has(m.id);
    const col = m.batt.percent<=20?'var(--amber)':'var(--green)';
    const battHtml = m.online
      ? `<div class="batt"><div class="track"><div class="fill" style="width:${m.batt.percent}%;background:${col}"></div></div><span class="pct">${m.batt.percent}%</span>${m.batt.plugged?bolt('#127a2e'):''}</div>`
      : `<span class="pct" style="color:#b5bcc6">—</span>`;
    return `<div class="mc ${sel?'sel':''} ${m.online?'':'off'}" onclick="toggleSel('${m.id}')">
      <div class="dot ${m.online?'on':'off'}"></div>
      <div><div class="nm">${m.name}</div><div class="sub">${m.online?m.ip:'ออฟไลน์'}</div></div>
      <div class="grow"></div>${battHtml}
      <div class="chk ${sel?'y':''}"></div></div>`;
  }).join('') || `<div class="empty">ไม่มีเครื่องในหมวดนี้</div>`;
  updateSelbar();
}
function toggleSel(id){ const m=byId(id); if(!m.online){ toast('เครื่องออฟไลน์ เลือกไม่ได้'); return; }
  state.sel.has(id)?state.sel.delete(id):state.sel.add(id); renderMachines(); }
function updateSelbar(){ const n=state.sel.size; const b=$('#selbar');
  if(n>0 && state.view==='machines'){ b.classList.remove('hide'); $('#selCount').textContent='เลือก '+n+' เครื่อง'; }
  else b.classList.add('hide'); }
function updateTop(){ const on=state.machines.filter(m=>m.online).length;
  $('#topR').innerHTML='● ออนไลน์ '+on+'/'+state.machines.length; }

// ================= TABS =================
function switchTab(v){
  state.view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  ['machines','command','files','lock'].forEach(k=>$('#s-'+k).classList.toggle('hide', k!==v));
  const titles={machines:'SL Control',command:'ผลลัพธ์คำสั่ง',files:'ส่งไฟล์',lock:'ล็อกจอ'};
  $('#topT').textContent=titles[v]; $('#topR').classList.toggle('hide', v!=='machines');
  if(v==='command') renderCommand();
  if(v==='files') renderFiles();
  if(v==='lock') renderLock();
  updateSelbar();
}

// ================= ACTIONS SHEET =================
function needSel(){ if(state.sel.size===0){ toast('เลือกเครื่องก่อน'); return false; } return true; }
function ids(){ return [...state.sel]; }
function names(){ return ids().map(i=>byId(i).name).join(', '); }
function openActions(){
  if(!needSel()) return;
  const acts=[
    ['lock','ล็อกจอ',`<rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>`,'#d93a41',0],
    ['unlock','ปลดล็อก',`<rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 7-2.6"/>`,'#3f4a5a',0],
    ['cmd','รันคำสั่ง',`<rect x="3" y="4" width="18" height="16" rx="2"/><polyline points="7 9 10 12 7 15"/><line x1="13" y1="15" x2="17" y2="15"/>`,'#3f4a5a',0],
    ['file','ส่งไฟล์',`<path d="M4 6h6l2 2h8v10H4z"/><line x1="12" y1="11" x2="12" y2="16"/><polyline points="9.5 13.5 12 11 14.5 13.5"/>`,'#3f4a5a',0],
    ['popup','ป๊อปอัพ',`<path d="M4 5h16v11H12l-4 3v-3H4z"/>`,'#3f4a5a',0],
    ['shutdown','ปิดเครื่อง',`<path d="M12 3v9"/><path d="M7 6a8 8 0 1 0 10 0"/>`,'#c02830',1],
    ['restart','รีสตาร์ท',`<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>`,'#c02830',1],
  ];
  const html=`<div class="sheet"><div class="sh-h">สั่งงาน ${state.sel.size} เครื่อง</div>
    <div class="sh-s">${names()}</div>
    <div class="agrid">${acts.map(a=>`<div class="act ${a[4]?'danger':''}" onclick="doAction('${a[0]}')">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="${a[3]}" stroke-width="2">${a[2]}</svg>
      <div class="tx">${a[1]}</div></div>`).join('')}</div></div>`;
  showOverlay(html);
}
function doAction(a){
  if(a==='lock'){ closeOverlay(); askText('ล็อกจอ','ข้อความบนจอที่ล็อก (เว้นว่างได้)','', v=>{
      T.lock(ids(),v).then(()=>toast('ล็อกจอ '+state.sel.size+' เครื่องแล้ว')); }); }
  else if(a==='unlock'){ closeOverlay(); T.unlock(ids()).then(()=>toast('ปลดล็อก '+state.sel.size+' เครื่องแล้ว')); }
  else if(a==='popup'){ closeOverlay(); askText('ส่งข้อความป๊อปอัพ','ข้อความที่จะเด้งบนเครื่องลูก','', v=>{
      if(!v){toast('ยังไม่ได้พิมพ์ข้อความ');return;} T.popup(ids(),v).then(()=>toast('ส่งข้อความแล้ว')); }); }
  else if(a==='shutdown'){ closeOverlay(); confirmDo('ปิดเครื่อง '+state.sel.size+' เครื่อง?','บังคับปิด (ไม่ถามเซฟงาน)',()=>{
      T.power(ids(),'shutdown').then(()=>toast('สั่งปิดเครื่องแล้ว')); }); }
  else if(a==='restart'){ closeOverlay(); confirmDo('รีสตาร์ท '+state.sel.size+' เครื่อง?','บังคับรีสตาร์ท',()=>{
      T.power(ids(),'restart').then(()=>toast('สั่งรีสตาร์ทแล้ว')); }); }
  else if(a==='cmd'){ closeOverlay(); openCmdSheet(); }
  else if(a==='file'){ closeOverlay(); openFileBrowse('root'); }
}

// ---- command ----
let cmdShell='cmd';
function openCmdSheet(){
  cmdShell='cmd';
  const html=`<div class="sheet"><div class="sh-h">รันคำสั่ง — ${state.sel.size} เครื่อง</div>
    <div class="sh-s">${names()}</div>
    <div class="seg"><div id="segC" class="on" onclick="setShell('cmd')">CMD</div><div id="segP" onclick="setShell('powershell')">PowerShell</div></div>
    <textarea id="cmdBox" class="mono" rows="3" placeholder="เช่น whoami"></textarea>
    <div class="rowbtn"><button class="btn ghost" onclick="closeOverlay()">ยกเลิก</button>
      <button class="btn primary" onclick="runCmd()">ส่งคำสั่ง</button></div></div>`;
  showOverlay(html); setTimeout(()=>$('#cmdBox').focus(),100);
}
function setShell(s){ cmdShell=s; $('#segC').classList.toggle('on',s==='cmd'); $('#segP').classList.toggle('on',s==='powershell'); }
function runCmd(){
  const cmd=$('#cmdBox').value.trim(); if(!cmd){ toast('พิมพ์คำสั่งก่อน'); return; }
  const targets=ids(); closeOverlay(); toast('กำลังรันคำสั่ง...'); switchTab('command'); renderCommandLoading(cmd);
  T.runCommand(targets,cmdShell,cmd).then(res=>{ state.lastResults={cmd,res}; renderCommand(); });
}
function renderCommandLoading(cmd){ $('#s-command').innerHTML=`<div class="empty">กำลังรัน <b>${cmd}</b> ...</div>`; }
let resSort=0;
function renderCommand(){
  const S=$('#s-command'); const d=state.lastResults;
  if(!d){ S.innerHTML=`<div class="empty"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#9aa3af" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><polyline points="7 9 10 12 7 15"/></svg>ยังไม่มีผลคำสั่ง<br>เลือกเครื่องแล้วสั่ง "รันคำสั่ง"</div>`; return; }
  let rows=d.res.slice();
  const rank=r=>r.code===0?0:1;
  if(resSort===1) rows.sort((a,b)=>rank(a)-rank(b));
  if(resSort===2) rows.sort((a,b)=>rank(b)-rank(a));
  const ok=d.res.filter(r=>r.code===0).length, fail=d.res.length-ok;
  S.innerHTML=`<div style="font-size:13px;color:#6b7683;margin:2px 2px 8px">คำสั่ง: <b>${d.cmd}</b>
      <span style="float:right;color:#d93a41;cursor:pointer" onclick="cycleSort()">↕ เรียงสถานะ</span></div>`
    + rows.map(r=>{ const g=r.code===0;
      return `<div class="rr" onclick="showFull('${r.id}')"><span class="nm">${r.name}</span>
        <span class="dot" style="background:${g?'#127a2e':'#c02830'}"></span>
        <span style="font-weight:600;font-size:12px;color:${g?'#127a2e':'#c02830'}">${g?'สำเร็จ':'พลาด'}</span>
        <span class="ans ${g?'':'r'}">${(r.output||'').split('\\n')[0]}</span></div>`; }).join('')
    + `<div class="foot"><span class="g">สำเร็จ ${ok}</span> · <span class="r">ไม่สำเร็จ ${fail}</span></div>`;
}
function cycleSort(){ resSort=(resSort+1)%3; renderCommand(); toast(['เรียงตามเดิม','สำเร็จขึ้นก่อน','ไม่สำเร็จขึ้นก่อน'][resSort]); }
function showFull(id){ const r=state.lastResults.res.find(x=>x.id===id);
  showOverlay(`<div class="sheet"><div class="sh-h">คำตอบ — ${r.name}</div>
    <div class="sh-s">${r.code===0?'สำเร็จ':'พลาด (exit '+r.code+')'}</div>
    <textarea class="mono" rows="8" readonly style="background:#f4f6f9">${r.output||'(ไม่มีข้อความ)'}</textarea>
    <div class="rowbtn"><button class="btn primary" onclick="closeOverlay()">ปิด</button></div></div>`); }

// ---- files ---- (เปิดดูไฟล์บน PC จริงผ่าน listpc)
let _fs=null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openFileBrowse(path){
  T.listFiles(path).then(fs=>{
    _fs=fs||{items:[]};
    if(fs && fs.error) toast('เปิดโฟลเดอร์ไม่ได้: '+fs.error);
    const hasUp = fs && fs.up!==null && fs.up!==undefined;
    const rows=(fs.items||[]).map((it,i)=> it.dir
      ? `<div class="fi" onclick="fsOpen(${i})"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#d9a441" stroke-width="2"><path d="M4 6h6l2 2h8v10H4z"/></svg><div><b>${esc(it.name)}</b></div></div>`
      : `<div class="fi" onclick="fsPick(${i})"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#5a6572" stroke-width="2"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg><div><b>${esc(it.name)}</b><div class="small">${esc(it.size||'')}</div></div></div>`
    ).join('') || '<div class="small" style="padding:16px 4px;color:#9aa3af">(โฟลเดอร์ว่าง)</div>';
    const html=`<div class="sheet"><div class="sh-h">เลือกไฟล์จาก PC</div>
      <div class="sh-s">${esc((fs&&fs.path)||'คอมพิวเตอร์นี้ (PC)')}</div>
      <div class="flist" style="max-height:46vh;overflow:auto">
      ${hasUp?`<div class="fi" onclick="fsUp()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#6b7683" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg><div>.. ย้อนกลับ</div></div>`:''}
      ${rows}</div>
      <div class="rowbtn"><button class="btn ghost" onclick="closeOverlay()">ยกเลิก</button></div></div>`;
    showOverlay(html);
  });
}
function fsOpen(i){ openFileBrowse(_fs.items[i].path); }
function fsUp(){ openFileBrowse(_fs.up || 'root'); }
function fsPick(i){ const it=_fs.items[i]; pickFile(it.path, it.name, it.size); }
function pickFile(path,name,size){
  closeOverlay();
  const targets=ids();
  state.fileJob={jobId:'pending',name:(name||path),size:size||'',_done:false,
    items:targets.map(id=>({id,name:byId(id).name,pct:0,done:false,fail:false}))};
  switchTab('files'); renderFiles();
  T.sendFile(targets, path, name);
}
function renderFiles(){
  const S=$('#s-files'); const j=state.fileJob;
  if(!j){ S.innerHTML=`<div class="empty"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#9aa3af" stroke-width="2"><path d="M4 6h6l2 2h8v10H4z"/></svg>ยังไม่มีการส่งไฟล์<br>เลือกเครื่อง → สั่งงาน → ส่งไฟล์</div>`; return; }
  const done=j.items.filter(i=>i.done).length, fail=j.items.filter(i=>i.fail).length, going=j.items.length-done-fail;
  S.innerHTML=`<div class="fbrow">ไฟล์จาก PC: <b>${j.name}</b><div class="small">ขนาด ${j.size} · เลือกจากเครื่องคอนโซล</div></div>`
    + j.items.map(it=>{
      const st = it.done?`<span class="g">100% ✓ สำเร็จ</span>`: it.fail?`<span class="r">พลาด</span>`:`<span style="color:#3a4655">${Math.round(it.pct)}%</span>`;
      return `<div class="fs"><div class="top2"><span class="nm">${it.name}</span>${st}</div>
        <div class="pbar"><div class="pfill ${it.done?'done':''}" style="width:${it.pct}%;${it.fail?'background:#c02830':''}"></div></div></div>`;
    }).join('')
    + `<div class="foot"><span class="g">เสร็จ ${done}</span> · <span style="color:#3a4655">กำลังส่ง ${going}</span> · <span class="r">พลาด ${fail}</span></div>`;
}

// ---- lock tab (3 โหมด) ----
function renderLock(){
  $('#s-lock').innerHTML=`
    <div class="lockrow" onclick="lockMode('all')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#d93a41" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><div class="tx"><b>ล็อกทุกเครื่อง</b><div>ล็อกทุกเครื่องที่ออนไลน์ + เครื่องที่เข้ามาใหม่</div></div></div>
    <div class="lockrow" onclick="lockMode('charging')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#3f4a5a" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><div class="tx"><b>ล็อกเครื่องที่กำลังชาร์จ</b><div>ชาร์จอยู่ = ล็อก · ถอดสาย = ปลด (อัตโนมัติ)</div></div></div>
    <div class="lockrow" onclick="lockMode('unlockall')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#3f4a5a" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 7-2.6"/></svg><div class="tx"><b>ปลดล็อกทุกเครื่อง</b><div>ปลดล็อกเครื่องที่ล็อกอยู่ทั้งหมด</div></div></div>`;
}
function lockMode(m){
  if(m==='all') askText('ล็อกทุกเครื่อง','ข้อความบนจอที่ล็อก (เว้นว่างได้)','',v=>toast('ล็อกทุกเครื่องแล้ว + เครื่องใหม่จะโดนล็อกอัตโนมัติ'));
  else if(m==='charging') toast('เปิดโหมดล็อก=ชาร์จแล้ว (เสียบชาร์จ=ล็อกเอง)');
  else toast('ปลดล็อกทุกเครื่องแล้ว');
}

// ================= OVERLAY / MODALS =================
function showOverlay(html){ closeOverlay(); const d=document.createElement('div'); d.className='ov'; d.id='ov';
  d.innerHTML=html; d.onclick=e=>{ if(e.target===d) closeOverlay(); }; $('.wrap').appendChild(d); }
function closeOverlay(){ const o=$('#ov'); if(o) o.remove(); }
function askText(title,ph,val,cb){
  showOverlay(`<div class="sheet"><div class="sh-h">${title}</div>
    <textarea id="tIn" rows="2" placeholder="${ph}" style="margin-top:10px">${val||''}</textarea>
    <div class="rowbtn"><button class="btn ghost" onclick="closeOverlay()">ยกเลิก</button>
      <button class="btn primary" onclick="(function(){var v=document.getElementById('tIn').value.trim();closeOverlay();(${cb.toString()})(v);})()">ตกลง</button></div></div>`);
  setTimeout(()=>$('#tIn').focus(),100);
}
function confirmDo(title,sub,cb){
  showOverlay(`<div class="ov center"></div>`); const o=$('#ov'); o.classList.add('center');
  o.innerHTML=`<div class="sheet card"><div class="sh-h">${title}</div><div class="sh-s">${sub}</div>
    <div class="rowbtn"><button class="btn ghost" onclick="closeOverlay()">ยกเลิก</button>
      <button class="btn primary" onclick="(function(){closeOverlay();(${cb.toString()})();})()">ยืนยัน</button></div></div>`;
  o.onclick=e=>{ if(e.target===o) closeOverlay(); };
}
</script>
